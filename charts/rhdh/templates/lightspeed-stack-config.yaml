kind: ConfigMap
apiVersion: v1
metadata:
  name: lightspeed-stack-config
  namespace: {{ .Release.Namespace }}
data:
  lightspeed-stack.yaml: |
    name: lightspeed-core-stack
    service:
      host: ${env.SERVICE_HOST:=127.0.0.1}
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
    llama_stack:
      use_as_library_client: true
      config:
        profile: /app-root/config.yaml
        native_override:
          vector_stores:
            annotation_prompt_params: # TODO: remove this once RAG is removed
              enable_annotations: true
              annotation_instruction_template: >
                When appropriate, cite sources at the end of sentences using doc_url and doc_title format.
                Citing sources is not always required because citations are handled externally.
                Never include any citation that is in the form '<| file-id |>'.
    inference:
      providers:
        - type: vllm
          id: vllm
          api_key_env: VLLM_API_KEY
          extra:
            base_url: ${env.VLLM_URL:=}
            max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
            network:
              tls:
                verify: ${env.VLLM_TLS_VERIFY:=true}
        - type: openai
          id: openai
          api_key_env: OPENAI_API_KEY
          extra:
            allowed_models:
              - gpt-4o-mini
              - gpt-5.1
              - gpt-4.1-mini
              - gpt-4.1-nano
        - type: vertexai
          id: vertexai
          extra:
            project: ${env.VERTEX_AI_PROJECT:=}
            location: ${env.VERTEX_AI_LOCATION:=global}
            allowed_models:
              - publishers/google/models/gemini-2.5-pro
              - publishers/google/models/gemini-2.5-flash-lite
              - publishers/google/models/gemini-3.1-pro-preview
              - publishers/google/models/gemini-3.5-flash-lite
        - type: sentence_transformers
    byok_rag:
      - rag_id: rhdh-docs
        rag_type: inline::faiss
        embedding_model: sentence-transformers//rag-content/embeddings_model
        embedding_dimension: 768
        vector_db_id: vs_757285d9-b657-4bed-b18c-3359844e8c0d
        db_path: /rag-content/vector_db/rhdh_product_docs/1.10/faiss_store.db
    rag:
      tool:
        - rhdh-docs
    vector_store:
      default_provider: notebooks
      providers:
        - id: notebooks
          type: pgvector
          embedding_model: /rag-content/embeddings_model
          embedding_dimension: 768
          config:
            host: ${env.PGVECTOR_HOST:=lightspeed-postgres-svc.lightspeed-postgres.svc.cluster.local}
            port: "5432"  # TODO: fix lcore parsing and revert back to env
            db: ${env.PGVECTOR_DB}
            user: ${env.PGVECTOR_USER}
            password: ${env.PGVECTOR_PASSWORD}
    user_data_collection:
      feedback_enabled: true
      feedback_storage: '/tmp/data/feedback'
    authentication:
      module: 'noop'
    conversation_cache:
      type: 'sqlite'
      sqlite:
        db_path: '/tmp/cache.db'
    customization:
      profile_path: '/app-root/rhdh-profile.py'
    mcp_servers:
      - name: mcp-integration-tools
        provider_id: 'model-context-protocol'
        url: 'http://localhost:7007/api/mcp-actions/v1'
        authorization_headers:
          Authorization: 'client'
    byok_rag:
      - rag_id: custom-org-docs
        rag_type: inline::faiss
        embedding_model: sentence-transformers//rag-content/embeddings_model
        embedding_dimension: 768
        vector_db_id: vs_727b6321-1ff4-47bf-a76b-1cc12426c954
        db_path: /rag-content/vector_db/custom_docs/faiss_store.db
        score_multiplier: 1.0
    rag:
      tool:
        - rhdh-docs
        - custom-org-docs
        - vs_cda156a6-64fe-436d-bc51-566fb1b09702
