apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rbac-policy
  namespace: {{ .Release.Namespace }}
data:
  rbac-policy.csv: |
    p, role:default/intelligent-assistant-user, intelligent-assistant.chat, use, deny
    p, role:default/intelligent-assistant-user, intelligent-assistant.notebooks, use, deny
    p, role:default/intelligent-assistant-user, intelligent-assistant.mcp.tools, use, deny
    p, role:default/intelligent-assistant-user, intelligent-assistant.skills, use, deny
    p, role:default/intelligent-assistant-user, catalog.entity.read, read, allow
    p, role:default/intelligent-assistant-user, catalog.location.read, read, allow

    g, user:default/mvaldron, role:default/intelligent-assistant-user
