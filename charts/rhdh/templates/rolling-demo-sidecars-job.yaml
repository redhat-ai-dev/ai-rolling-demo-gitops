{{- if not .Values.global.ci }}
apiVersion: batch/v1
kind: Job
metadata:
  name: update-deployment-containers
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    spec:
      containers:
        - name: patch-deployment
          image: quay.io/redhat-ai-dev/utils:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              DEPLOYMENT="{{ .Release.Name }}-backstage"
              NAMESPACE="{{ .Release.Namespace }}"

              echo "Waiting deployment ${DEPLOYMENT} to be available.."
              kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=600s

              echo "Checking if containers already exist in deployment..."
              CONTAINERS=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o json | jq '.spec.template.spec.containers[] | .name')

              # Create temp dir and files
              TEMP_DIR=$(mktemp -d)
              PATCH_FILE="${TEMP_DIR}/patch.json"

              cat > "${TEMP_DIR}/feedback-harvester-sidecar.json" <<EOF
              {
                "name": "feedback-harvester",
                "env": [
                  { "name": "PGUSER", "valueFrom": { "secretKeyRef": { "name": "lightspeed-postgres-info", "key": "user" } } },
                  { "name": "PGPASSWORD", "valueFrom": { "secretKeyRef": { "name": "lightspeed-postgres-info", "key": "password" } } },
                  { "name": "PGDATABASE", "valueFrom": { "secretKeyRef": { "name": "lightspeed-postgres-info", "key": "db-name" } } },
                  { "name": "PGHOST", "value": "lightspeed-postgres-svc.lightspeed-postgres.svc.cluster.local" },
                  { "name": "PGPORT", "value": "5432" },
                  { "name": "FEEDBACK_DIRECTORY", "value": "/tmp/data/feedback" },
                  { "name": "FETCH_FREQUENCY", "value": "60" }
                ],
                "image": "quay.io/redhat-ai-dev/feedback-harvester:v0.1.0",
                "volumeMounts": [
                  { "mountPath": "/tmp/data/feedback", "name": "lightspeed-data", "subPath": "data/feedback" }
                ]
              }
              EOF

              # build the file used for patching
              echo "[" > "$PATCH_FILE"

              add_patch_operation() {
                local operation=$1
                local path=$2
                local json_file=$3
                local is_last=$4

                echo "  {" >> "$PATCH_FILE"
                echo "    \"op\": \"$operation\"," >> "$PATCH_FILE"

                # Only add value field if it's not a remove operation
                if [ "$operation" != "remove" ]; then
                  echo "    \"path\": \"$path\"," >> "$PATCH_FILE"
                  echo "    \"value\": $(cat $json_file)" >> "$PATCH_FILE"
                else
                  echo "    \"path\": \"$path\"" >> "$PATCH_FILE"
                fi

                if [ "$is_last" = "true" ]; then
                  echo "  }" >> "$PATCH_FILE"
                else
                  echo "  }," >> "$PATCH_FILE"
                fi
              }

              # Mount VERTEX_AI_CREDENTIALS into lightspeed-core at /app-root/gcp-creds.json.
              # Volume is declared in values.yaml extraVolumes; chart 6.1.1 has no sidecar.extraVolumeMounts.
              # Folded into the same post-deploy patch as the sidecars (one rollout).
              # TODO: remove this op once we upgrade to an rhdh-chart that supports
              # lightspeed.core.extraVolumeMounts (see https://github.com/redhat-developer/rhdh-chart/pull/438).
              LS_INDEX=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o json | jq '.spec.template.spec.containers | map(.name == "lightspeed-core") | index(true)')
              ADD_GCP_MOUNT="false"
              if [ "$LS_INDEX" != "null" ]; then
                HAS_GCP_MOUNT=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o json | jq --argjson idx "$LS_INDEX" '.spec.template.spec.containers[$idx].volumeMounts // [] | any(.name == "gcp-creds")')
                if [ "$HAS_GCP_MOUNT" = "false" ]; then
                  ADD_GCP_MOUNT="true"
                  cat > "${TEMP_DIR}/gcp-creds-mount.json" <<EOF
              {
                "name": "gcp-creds",
                "mountPath": "/app-root/gcp-creds.json",
                "subPath": "gcp-creds.json",
                "readOnly": true
              }
              EOF
                else
                  echo "gcp-creds volumeMount already present on lightspeed-core, skipping..."
                fi
              else
                echo "WARNING: lightspeed-core container not found; skipping gcp-creds volumeMount"
              fi

              # Feedback Harvester: Add/Replace (last sidecar op unless gcp-creds mount follows)
              FH_IS_LAST="true"
              if [ "$ADD_GCP_MOUNT" = "true" ]; then
                FH_IS_LAST="false"
              fi
              if echo "$CONTAINERS" | grep -q '"feedback-harvester"'; then
                echo "Container 'feedback-harvester' already exists, will replace..."
                FEEDBACK_HARVESTER_INDEX=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o json | jq '.spec.template.spec.containers | map(.name == "feedback-harvester") | index(true)')
                add_patch_operation "replace" "/spec/template/spec/containers/$FEEDBACK_HARVESTER_INDEX" "${TEMP_DIR}/feedback-harvester-sidecar.json" "$FH_IS_LAST"
              else
                echo "Container 'feedback-harvester' does not exist, will add..."
                add_patch_operation "add" "/spec/template/spec/containers/-" "${TEMP_DIR}/feedback-harvester-sidecar.json" "$FH_IS_LAST"
              fi

              if [ "$ADD_GCP_MOUNT" = "true" ]; then
                echo "Adding gcp-creds volumeMount to lightspeed-core..."
                add_patch_operation "add" "/spec/template/spec/containers/${LS_INDEX}/volumeMounts/-" "${TEMP_DIR}/gcp-creds-mount.json" "true"
              fi

              echo "]" >> "$PATCH_FILE"

              echo "Applied in detail:"
              cat "$PATCH_FILE" | jq '.'

              echo "Patching ${DEPLOYMENT} .."
              kubectl patch deployment $DEPLOYMENT -n $NAMESPACE --type='json' --patch="$(cat $PATCH_FILE)"
      restartPolicy: OnFailure
  backoffLimit: 4
{{- end }}
