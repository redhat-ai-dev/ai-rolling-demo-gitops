          providers:
            ogx:
              baseUrl: ${BOOST_OGX_URL:-http://localhost:8321}
              defaultModel: ${BOOST_MODEL:-default}
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /healthcheck
          port: 7007
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 2
        timeoutSeconds: 2
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /healthcheck
          port: 7007
          scheme: HTTP
        initialDelaySeconds: 60
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 2
      extraEnvVars:
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: "{{ .Release.Name }}-postgresql"
        # Only for demo purposes: Remove in production
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        # Enable NFS app-next frontend shell (required for pure-NFS plugins like boost)
        - name: APP_CONFIG_app_packageName
          value: "app-next"
        - name: ENABLE_STANDARD_MODULE_FEDERATION
          value: "true"
      extraEnvVarsSecrets:
        - github-secrets
        - kubernetes-secrets
        - rhdh-secrets
        - keycloak-secrets
        - argocd-secrets
        - lightspeed-secrets
        - llama-stack-secrets
        - kserve-connector-secrets
      args:
        - "--config"
        - dynamic-plugins-root/app-config.dynamic-plugins.yaml
      extraVolumeMounts:
        - name: dynamic-plugins-root
          mountPath: /opt/app-root/src/dynamic-plugins-root
        # tmp backstage volume for scaffolder tasks
        - name: backstage-tmp
          mountPath: /tmp
        - name: extensions-catalog
          mountPath: /extensions
        - name: rbac-policy
          mountPath: /opt/app-root/src/rbac-policy.csv
          subPath: rbac-policy.csv
      extraVolumes:
        - name: dynamic-plugins-root
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 4Gi
        - name: dynamic-plugins
          configMap:
            defaultMode: 420
            name: "{{ .Release.Name }}-dynamic-plugins"
            optional: true
        - name: dynamic-plugins-npmrc
          secret:
            defaultMode: 420
            optional: true
            secretName: dynamic-plugins-npmrc
        # tmp backstage volume for scaffolder tasks
        - name: backstage-tmp
          emptyDir: {}
        - name: extensions-catalog
          emptyDir: {}
        - name: rbac-policy
          configMap:
            name: "{{ .Release.Name }}-rbac-policy"
        # GCP SA JSON for Vertex AI. Pod volume is Helm-managed; lightspeed-core volumeMount is
        # applied by rolling-demo-sidecars-job until rhdh-chart gains lightspeed.core.extraVolumeMounts
        # (https://github.com/redhat-developer/rhdh-chart/pull/438) — that PostSync patch becomes redundant.
        - name: gcp-creds
          secret:
            secretName: llama-stack-secrets
            items:
              - key: VERTEX_AI_CREDENTIALS
                path: gcp-creds.json
      initContainers:
        - name: install-dynamic-plugins
          image: '{{ include "backstage.image" . }}'
          command:
            - ./install-dynamic-plugins.sh
            - /dynamic-plugins-root
          env:
            - name: NPM_CONFIG_USERCONFIG
              value: /opt/app-root/src/.npmrc.dynamic-plugins
            - name: CATALOG_INDEX_IMAGE
              value: '{{ .Values.global.catalogIndex.image.registry }}/{{ .Values.global.catalogIndex.image.repository }}:{{ .Values.global.catalogIndex.image.tag }}'
            - name: CATALOG_ENTITIES_EXTRACT_DIR
              value: '/extensions'
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /dynamic-plugins-root
              name: dynamic-plugins-root
            - mountPath: /opt/app-root/src/dynamic-plugins.yaml
              name: dynamic-plugins
              readOnly: true
              subPath: dynamic-plugins.yaml
            - mountPath: /opt/app-root/src/.npmrc.dynamic-plugins
              name: dynamic-plugins-npmrc
              readOnly: true
              subPath: .npmrc
            - mountPath: /extensions
              name: extensions-catalog
        - name: byok-rag-init
          image: quay.io/redhat-ai-dev/byok-sample:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
          args:
            - >-
              echo 'Staging BYOK RAG data...' &&
              mkdir -p /rag-content/byok-staging &&
              if cp -r /byok/vector_db /rag-content/byok-staging/ 2>&1; then
                echo 'BYOK staging complete.';
              else
                echo 'WARNING: BYOK staging failed. LCS will start without BYOK sources.' >&2;
              fi
          volumeMounts:
            - name: lightspeed-rag
              mountPath: /rag-content
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 150Mi
      installDir: /opt/app-root/src
      podAnnotations:
        checksum/dynamic-plugins: >-
          {{- include "common.tplvalues.render" ( dict "value"
          .Values.global.dynamic "context" $) | sha256sum }}
    ingress:
      host: "{{ .Values.global.host }}"
    postgresql:
      enabled: true
      postgresqlDataDir: /var/lib/pgsql/data/userdata
      image:
        registry: registry.redhat.io
        repository: rhel9/postgresql-15
        tag: latest
      auth:
        username: postgres
        existingSecret: "{{ .Release.Name }}-postgresql"
        secretKeys:
          adminPasswordKey: postgres-password
      primary:
        podSecurityContext:
          enabled: false
        containerSecurityContext:
          enabled: false
        persistence:
          enabled: true
          size: 1Gi
          mountPath: /var/lib/pgsql/data
        extraEnvVars:
          - name: POSTGRESQL_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: "{{ .Release.Name }}-postgresql"
  route:
    annotations: {}
    enabled: true
    host: "{{ .Values.global.host }}"
    path: "/"
    wildcardPolicy: None
    tls:
      enabled: true
      termination: "edge"
      certificate: ""
      key: ""
      caCertificate: ""
      destinationCACertificate: ""
      insecureEdgeTerminationPolicy: "Redirect"
rhoai:
  enabled: true
