name: Nightly UI Tests

# Scheduled runs execute the workflow file on the default branch (main).
# Each job checks out its own ref and tests that ref's live RHDH instance.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        type: choice
        default: both
        options:
          - both
          - main
          - development

jobs:
  # matrix is not available in a job-level if. Build the include list here.
  targets:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'both' }}
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          main = {
              "ref": "main",
              "base_url": "",
              "alert_failure": "NightlyRollingDemoTestsFailed",
              "alert_success": "NightlyRollingDemoTestsPassed",
              "summary_failure": "Nightly UI tests failed on the `main` branch.",
              "summary_success": "Nightly UI tests passed on the `main` branch.",
          }
          development = {
              "ref": "development",
              "base_url": "https://rhdhai-rhdh-dev-backstage-rhdhai-development.apps.rosa.redhat-ai-dev.m6no.p3.openshiftapps.com",
              "alert_failure": "NightlyDevelopmentTestsFailed",
              "alert_success": "NightlyDevelopmentTestsPassed",
              "summary_failure": "Nightly UI tests failed on the `development` branch.",
              "summary_success": "Nightly UI tests passed on the `development` branch.",
          }
          selected = {
              "main": [main],
              "development": [development],
          }.get(os.environ["REF"], [main, development])
          print("matrix=" + json.dumps({"include": selected}))
          PY

  ui-tests:
    name: Run UI Tests (${{ matrix.ref }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Run tests
        working-directory: tests
        env:
          RHDH_BASE_URL: ${{ matrix.base_url != '' && matrix.base_url || secrets.RHDH_BASE_URL }}
          RHDH_ENVIRONMENT: ${{ secrets.RHDH_ENVIRONMENT }}
          ROLLING_DEMO_TEST_USERNAME: ${{ secrets.ROLLING_DEMO_TEST_USERNAME }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: npx playwright test

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_NAME: ${{ matrix.alert_failure }}
          SUMMARY: ${{ matrix.summary_failure }}
          DESCRIPTION: One or more tests failed.
          SEVERITY: critical
          COLOR: "#FF0000"
          STATUS: FIRING
        run: |
          jq -n \
            --arg text "*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|[$STATUS] $ALERT_NAME>*" \
            --arg summary "$SUMMARY" \
            --arg description "$DESCRIPTION" \
            --arg severity "$SEVERITY" \
            --arg color "$COLOR" \
            '{
              text: $text,
              attachments: [
                {
                  color: $color,
                  fields: [
                    {title: "Summary", value: $summary, short: false},
                    {title: "Description", value: $description, short: false},
                    {title: "Severity", value: $severity, short: true}
                  ]
                }
              ]
            }' | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_NAME: ${{ matrix.alert_success }}
          SUMMARY: ${{ matrix.summary_success }}
          DESCRIPTION: All tests passed.
          SEVERITY: info
          COLOR: "#36A64F"
          STATUS: RESOLVED
        run: |
          jq -n \
            --arg text "*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|[$STATUS] $ALERT_NAME>*" \
            --arg summary "$SUMMARY" \
            --arg description "$DESCRIPTION" \
            --arg severity "$SEVERITY" \
            --arg color "$COLOR" \
            '{
              text: $text,
              attachments: [
                {
                  color: $color,
                  fields: [
                    {title: "Summary", value: $summary, short: false},
                    {title: "Description", value: $description, short: false},
                    {title: "Severity", value: $severity, short: true}
                  ]
                }
              ]
            }' | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-
