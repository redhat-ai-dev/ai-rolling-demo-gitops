  clusterRouterBase: apps.rosa.redhat-ai-dev.m6no.p3.openshiftapps.com
  host: ""
  auth:
    backend:
      enabled: true
      existingSecret: ""
      value: ""

  # Configure lightspeed post GA
  lightspeed:
    enabled: true
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant:bs_1.52.0__3.2.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:bs_1.52.0__3.2.0
        disabled: false
    secret:
      create: false
      name: "llama-stack-secrets"
    sidecar:
      image: quay.io/lightspeed-core/lightspeed-stack:dev-20260824-cbd182b
      args:
        - --synthesized-config-output
        - /tmp/.generated/run.yaml
      # Path to the VERTEX_AI_CREDENTIALS key mounted from llama-stack-secrets.
      # volumeMount is applied by rolling-demo-sidecars-job (chart 6.1.1 has no sidecar.extraVolumeMounts).
      # TODO: after upgrading to an rhdh-chart with lightspeed.core.extraVolumeMounts
      # (https://github.com/redhat-developer/rhdh-chart/pull/438), mount via values and drop the
      # PostSync patch — that workaround will be redundant.
      env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app-root/gcp-creds.json
        # Redirect the HuggingFace/sentence-transformers cache into the writable
        # /tmp emptyDir. Required because the sidecar runs readOnlyRootFilesystem:true;
        # without this, embedding model loading fails writing to ~/.cache. Mirrors rhdh-chart.
        - name: HF_HOME
          value: /tmp/hf_cache
        # Points LCORE at the OKP service. The lightspeed-stack-config.yaml is synced
        # from lightspeed-configs (source of truth) with a localhost default, so the
        # cluster-specific OKP URL is injected here instead. Rendered via
        # common.tplvalues.render (tpl), so the Helm expression resolves; the sync
        # generator only seds the sidecar image line, leaving this env intact.
        - name: OKP_SERVICE_URL
          value: "http://{{ .Release.Name }}-lightspeed-okp-{{ .Release.Namespace }}.{{ .Values.global.clusterRouterBase }}"
    configMaps:
      - name: stack
        create: false
        nameOverride: "lightspeed-stack-config"
        mountPath: /app-root/lightspeed-stack.yaml
        subPath: lightspeed-stack.yaml
        sourceFile: lightspeed-stack.yaml
        optional: false
      - name: rhdh-profile
        create: false
        nameOverride: "rhdh-profile"
        mountPath: /app-root/rhdh-profile.py
        subPath: rhdh-profile.py
        sourceFile: rhdh-profile.py
        optional: false
    initContainer:
      name: lightspeed-rag-init
      args:
        - >-
          mkdir -p /tmp/data &&
          echo 'Copying Lightspeed RAG data...' &&
          cp -r /rag/vector_db /rag-content/ &&
          cp -r /rag/embeddings_model /rag-content/ &&
          echo 'Standard RAG copy complete.' &&
          if [ -d /rag-content/byok-staging/vector_db ]; then
            echo 'Merging BYOK data...' &&
            if cp -r /rag-content/byok-staging/vector_db/* /rag-content/vector_db/ 2>&1; then
              echo 'BYOK merge complete.';
            else
              echo 'WARNING: BYOK merge failed. LCS will start without BYOK sources.' >&2;
            fi;
          else
            echo 'No BYOK staging data, skipping.';
          fi

backstage:
  # override the default name to stay in the context
  # of the same deployment resource (e.g. rolling-demo-backstage)
  # where the latest rhdh-chart introduces rolling-demo-developer-hub
  nameOverride: backstage
  upstream:
    nameOverride: backstage
    backstage:
      image:
        registry: quay.io
        repository: rhdh/rhdh-hub-rhel9
        tag: "2.0-61"
        pullSecrets:
          - quay-pull-secret
      command: []
      extraAppConfig:
        - filename: kserve-connector-app-config.yaml
          configMapRef: kserve-connector-app-config
      appConfig:
        app:
          title: AI Rolling Demo Developer Hub
          baseUrl: "${RHDH_BASE_URL}"
          extensions:
            - app/routes:
                config:
                  redirects:
                    - from: /
                      to: /home
            # Disable homepage widgets and visit tracking infrastructure
            # to avoid "Something Went Wrong" error boxes on the home page
            - home-page-widget:home/recently-visited: false
            - home-page-widget:home/top-visited: false
            - api:home/visits: false
            - app-root-element:home/visit-listener: false
          analytics:
            adoptionInsights:
              maxBufferSize: 20
              flushInterval: 5000
              debug: false
              licensedUsers: 50
        auth:
          environment: production
          # Enable experimental features for OIDC auth
          experimentalClientIdMetadataDocuments:
            enabled: true
          experimentalDynamicClientRegistration:
            enabled: true
            allowedRedirectUriPatterns:
              - '*'
          experimentalRefreshToken:
            enabled: true
          session:
            secret: "${BACKEND_SECRET}"
          providers:
            oidc:
              production:
                metadataUrl: "${KEYCLOAK_METADATA_URL}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                callbackUrl: "${RHDH_CALLBACK_URL}"
                prompt: auto
                signIn:
                  resolvers:
                    - resolver: preferredUsernameMatchingUserEntityName
              development:
                metadataUrl: "${KEYCLOAK_METADATA_URL}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                callbackUrl: "${RHDH_CALLBACK_URL}"
                prompt: auto
                signIn:
                  resolvers:
                    - resolver: preferredUsernameMatchingUserEntityName
        backend:
          actions:
            pluginSources:
              - 'software-catalog-mcp-extras'
              - 'techdocs-mcp-extras'
              - 'scaffolder-mcp-extras'
          auth:
            externalAccess:
              - type: static
                options:
                  token: ${ADMIN_TOKEN}
                  subject: admin-curl-access
              - type: static
                options:
                  token: ${MCP_TOKEN}
                  subject: mcp-clients
            keys:
              - secret: "${BACKEND_SECRET}"
          baseUrl: "${RHDH_BASE_URL}"
          database:
            connection:
              password: ${POSTGRESQL_ADMIN_PASSWORD}
              user: postgres
          cors:
            origin: "${RHDH_BASE_URL}"
          csp:
            upgrade-insecure-requests: false
            img-src:
              - "'self'"
              - "data:"
              - https://img.freepik.com
              - https://cdn.dribbble.com
              - https://upload.wikimedia.org
              - https://podman-desktop.io
              - https://argo-cd.readthedocs.io
              - https://instructlab.ai
              - https://quay.io
              - https://news.mit.edu
            script-src:
              - "'self'"
              - "'unsafe-eval'"
              - https://cdn.jsdelivr.net
          reading:
            allow:
              - host: example.com
              - host: '*.mozilla.org'
              - host: '*.openshift.com'
              - host: '*.openshiftapps.com'
        techdocs:
          builder: local
          generator:
            runIn: local
        signInPage: oidc
        catalog:
          rules:
            - allow: [User, Group, System, Domain, Component, Resource, Location, Template, API, AiResource, AiModelServerAPI]
          locations:
            - target: https://github.com/benwilcock/rhdh-techdocs/blob/main/rhdh-catalog-info.yaml
              rules:
                - allow: [Component, System]
              type: url
            - target: https://github.com/redhat-ai-dev/ai-lab-template/blob/ai-rolling-demo-1_10/all.yaml
              type: url
              rules:
                - allow: [Component, Location, Template]
            - target: https://github.com/redhat-ai-dev/llama-stack-agentic-sample/blob/ai-rolling-demo-1_10/all.yaml
              type: url
              rules:
                - allow: [Component, Location, Template]
            - target: https://github.com/redhat-ai-dev/ai-rolling-demo-gitops/blob/development/catalog-info.yaml
              type: url
              rules:
                - allow: [Component, System]
          providers:
            modelCatalog:
              kserve-kubeflow-connector:
                cluster-1:
                  name: my-k8s-cluster
                  kubeflow-model-catalog-url: '${KUBEFLOW_MODEL_CATALOG_URL:-}'
                  default-owner: '${OWNER:-default-owner}'
                  default-lifecycle: '${LIFECYCLE:-production}'
            github:
              providerId:
                organization: "${GITOPS_GIT_ORG}"
                schedule:
                  frequency:
                    minutes: 15
                  initialDelay:
                    seconds: 15
                  timeout:
                    minutes: 15
            githubOrg:
              githubUrl: https://github.com
              orgs: ["${GITOPS_GIT_ORG}"]
              schedule:
                frequency:
                  minutes: 15
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 15
            keycloakOrg:
              default:
                baseUrl: "${KEYCLOAK_BASE_URL}"
                loginRealm: "${KEYCLOAK_REALM}"
                realm: "${KEYCLOAK_REALM}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                schedule:
                  frequency: { minutes: 1 }
                  timeout: { minutes: 1 }
                  initialDelay: { seconds: 15 }
                signIn:
                  resolvers:
                    - resolver: emailMatchingUserEntityProfileEmail
        intelligent-assistant:
          notebooks:
            enabled: true
            queryDefaults:
              model: ${NOTEBOOKS_QUERY_MODEL}
              provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}
          mcpServers:
            - name: mcp-integration-tools
              auth: dcr
        mcpActions:
          namespacedToolNames: false
        permission:
          enabled: true
          rbac:
            policies-csv-file: /opt/app-root/src/rbac-policy.csv
            defaultPermissions:
              defaultRole: role:default/user
              basicPermissions:
                - permission: catalog.entity.read
                  action: read
                - permission: intelligent-assistant.chat.read
                  action: read
                - permission: intelligent-assistant.chat.create
                  action: create
                - permission: intelligent-assistant.chat.update
                  action: update
                - permission: intelligent-assistant.chat.delete
                  action: delete
                - permission: intelligent-assistant.mcp.read
                  action: read
            admin:
              users:
                - name: user:default/jcollier
                - name: user:default/mvaldron
                - name: user:default/lucasyoon
        integrations:
          github:
            - apps:
                - appId: ${GITHUB_APP_APP_ID}
                  clientId: ${GITHUB_APP_CLIENT_ID}
                  clientSecret: ${GITHUB_APP_CLIENT_SECRET}
                  webhookUrl: ${GITHUB_APP_WEBHOOK_URL}
                  webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
                  privateKey: |
                    ${GITHUB_APP_PRIVATE_KEY}
              host: github.com
        kubernetes:
          clusterLocatorMethods:
            - clusters:
                - authProvider: serviceAccount
                  name: default
                  serviceAccountToken: ${K8S_CLUSTER_TOKEN}
                  skipTLSVerify: true
                  url: https://kubernetes.default.svc
              type: config
          customResources:
            - apiVersion: v1beta1
              group: tekton.dev
              plural: pipelines
            - apiVersion: v1beta1
              group: tekton.dev
              plural: pipelineruns
            - apiVersion: v1beta1
              group: tekton.dev
              plural: taskruns
            - apiVersion: v1
              group: route.openshift.io
              plural: routes
          serviceLocatorMethod:
            type: multiTenant
        argocd:
          username: ${ARGOCD_USER}
          password: ${ARGOCD_PASSWORD}
          waitCycles: 25
          appLocatorMethods:
          - type: 'config'
            instances:
              - name: default
                url: https://${ARGOCD_HOSTNAME}
                token: ${ARGOCD_API_TOKEN}
        i18n:
          locales:
            - en
            - it
            - ja
            - fr
        proxy:
          endpoints:
            "/developer-hub":
              target: https://raw.githubusercontent.com
              pathRewrite:
                "^/api/proxy/developer-hub$": "/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/homepage/plugins/homepage/dev/quickaccess-default.json"
                "^/api/proxy/developer-hub/learning-paths": "/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/ai-integrations/plugins/ai-experience/src/learning-paths/data.json"
              changeOrigin: true
              secure: false
            "/ai-rssfeed":
              target: "https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml"
              changeOrigin: true
              followRedirects: true
        boost:
          security:
            mode: 'development-only-no-auth'
            adminUsers:
              - 'user:default/admin'
              - 'user:default/guest'
          entityProviders:
            ogx:
              baseUrl: ${BOOST_OGX_URL:-http://localhost:8321}
              defaultAgent: router
              maxAgentTurns: 10
              agents:
                - id: router
                  name: FantaCo Router
                  description: Customer service router that classifies and transfers to specialists
                  instructions: |
                    You are a customer service router for FantaCo. Classify the user's
                    question and transfer to the appropriate specialist agent.

                    Transfer rules:
                    - Legal questions (software licenses, embargoes, privacy/PII,
                      contracts, policies, compliance) -> transfer to Legal
                    - Technical support (OpenShift/Kubernetes, deployment, permissions,
                      performance, FantaCo products like CloudSync or TechGear Pro,
                      troubleshooting) -> transfer to Software Support
                    - HR questions (benefits, health care, vacation/PTO, retirement,
                      workspaces, office facilities, bonuses, compensation, perks,
                      participation requirements) -> transfer to Human Resources.
                      If the question mentions "workspaces at FantaCo", ALWAYS transfer
                      to Human Resources.
                    - Sales questions (territories, leads, discounting, quotas, CRM,
                      brand guidelines, expenses, escalations, performance metrics)
                      -> transfer to Sales
                    - Procurement questions (competitive bidding, vendor evaluation,
                      ethics, transparency, spending limits, approval processes)
                      -> transfer to Procurement

                    Always transfer to the most appropriate specialist. Do not answer
                    the question yourself.
                  handoffs:
                    - legal
                    - support
