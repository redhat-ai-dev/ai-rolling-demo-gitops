apiVersion: v2
name: rolling-demo
description: A Helm chart for deploying the RHDHPAI rolling demo to an OpenShift Cluster
type: application
version: 0.1.0
appVersion: "1.16.0"
dependencies:
  - name: backstage
    repository: https://redhat-developer.github.io/rhdh-chart/
    version: "7.0.99"
  # OKP (Offline Knowledge Portal) vendored subchart — see charts/rhdh/charts/okp.
  # Enabled by default; disabled in CI (Kind lacks OpenShift Route CRD + 9GB image).
  - name: okp
    version: "0.1.0"
    condition: okp.enabled
