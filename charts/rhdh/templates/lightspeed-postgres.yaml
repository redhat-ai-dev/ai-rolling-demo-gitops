{{- if and (not .Values.global.ci) (not .Values.global.isSecondaryInstance) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lightspeed-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: password
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: user
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: db-name
        - name: PGDATA
          value: /var/lib/postgresql/data/pg
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: lightspeed-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightspeed-postgres-pvc
  namespace: lightspeed-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-postgres-svc
  namespace: lightspeed-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-postgres-db
  namespace: lightspeed-postgres
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
      - name: postgres-job
        image: pgvector/pgvector:pg15
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: password
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: user
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: db-name
        - name: DEV_PGDATABASE
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: dev-db-name
              optional: true
        - name: DEV_PGUSER
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: dev-user
              optional: true
        - name: DEV_PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: dev-password
              optional: true
        - name: PGHOST
          value: lightspeed-postgres-svc
        command:
        - sh
        - -c
        - |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER"; do
            sleep 2
          done
          echo "Postgres is ready, enabling pgvector and creating tables..."

          if [ -n "$DEV_PGDATABASE" ] && [ -n "$DEV_PGUSER" ] && [ -n "$DEV_PGPASSWORD" ]; then
            if [ "$DEV_PGDATABASE" = "$PGDATABASE" ] || [ "$DEV_PGUSER" = "$PGUSER" ]; then
              echo "Development database/user must be distinct from the primary Postgres credentials."
              exit 1
            fi
            echo "Ensuring development database and role exist..."
            # Idempotent: this Job is replaced on every ArgoCD sync (Force=true,Replace=true).
            # Use psql variables so identifiers/passwords are quoted; CREATE DATABASE cannot
            # run in a DO block, so existence is checked via SELECT ... \gexec.
            if ! psql -v ON_ERROR_STOP=1 \
              --set=dev_db="$DEV_PGDATABASE" \
              --set=dev_user="$DEV_PGUSER" \
              --set=dev_password="$DEV_PGPASSWORD" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'dev_user', :'dev_password')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'dev_user')
          \gexec
          ALTER ROLE :"dev_user" WITH PASSWORD :'dev_password';
          SELECT format('CREATE DATABASE %I OWNER %I', :'dev_db', :'dev_user')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dev_db')
          \gexec
          ALTER DATABASE :"dev_db" OWNER TO :"dev_user";
          SQL
            then
              echo "Failed to configure development database."
              exit 1
            fi
            echo "Development database configured successfully."
          fi

          psql <<EOF
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE TABLE IF NOT EXISTS feedback (
            id SERIAL PRIMARY KEY,
            user_id TEXT NOT NULL,
            timestamp TEXT NOT NULL,
            conversation_id TEXT NOT NULL,
            user_question TEXT NOT NULL,
            llm_response TEXT NOT NULL,
            sentiment INTEGER,
            user_feedback TEXT
          );
          EOF
      restartPolicy: OnFailure
{{- end }}