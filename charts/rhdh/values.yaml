global:
  ci: false
redhat-developer-hub:
  # Keep the existing <release>-backstage Route, Service, and Deployment names.
  # Setup URLs, OIDC callbacks, and CI ingress/service references depend on them.
  nameOverride: backstage
  image:
    registry: quay.io
    repository: rhdh/rhdh-hub-rhel10
    tag: 2.1-105
  imagePullSecrets:
    - name: quay-pull-secret
  catalogIndex:
    image:
      registry: quay.io
      repository: rhdh/plugin-catalog-index
      tag: "2.1"
  intelligentAssistant:
    enabled: true
    okp:
      enabled: true
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant:bs_1.54.9__5.3.6
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:bs_1.54.9__5.3.6
        disabled: false
    existingSecret: "llama-stack-secrets"
    core:
      image:
        registry: quay.io
        repository: lightspeed-core/lightspeed-stack
        tag: 0.7.0
      extraEnv:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app-root/gcp-creds.json
      extraVolumeMounts:
        - name: lightspeed-skills
          mountPath: /app-root/skills
        - name: gcp-creds
          mountPath: /app-root/gcp-creds.json
          subPath: gcp-creds.json
          readOnly: true
      resources:
        # Higher limits: sidecar CPU-throttles and OOMKills during notebook embedding.
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
    config:
      stack:
        existingConfigMap:
          name: lightspeed-stack-config
          key: lightspeed-stack.yaml
  appConfig:
    app:
      title: AI Rolling Demo Developer Hub
      baseUrl: "${RHDH_BASE_URL}"
      extensions:
        - app/routes:
            config:
              redirects:
                - from: /
                  to: /home
        - page:home: false
        - page:homepage:
            config:
              path: /home
        # Disable as it conflicts with (nav-content:app/sidebar)
        - nav-content:app: false
        # Disable homepage widgets and visit tracking infrastructure
        # to avoid "Something Went Wrong" error boxes on the home page
        - home-page-widget:homepage/recently-visited-card: false
        - home-page-widget:homepage/top-visited-card: false
        - api:home/visits: false
        - app-root-element:home/visit-listener: false
      analytics:
        adoptionInsights:
          maxBufferSize: 20
          flushInterval: 5000
          debug: false
          licensedUsers: 50
    homepage:
      defaultWidgets:
        - id: rhdh-onboarding-section
          ref: rhdh-onboarding-section
          props:
            title: Onboarding section
        - id: rhdh-entity-section
          ref: rhdh-entity-section
          props:
            title: Entity section
        - id: rhdh-template-section
          ref: rhdh-template-section
          props:
            title: Template section
    auth:
      environment: production
      experimentalDynamicClientRegistration:
        enabled: true
        allowedRedirectUriPatterns:
          - '*'
      experimentalRefreshToken:
        enabled: true
      session:
        secret: "${BACKEND_SECRET}"
      providers:
        oidc:
          production:
            metadataUrl: "${KEYCLOAK_METADATA_URL}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            callbackUrl: "${RHDH_CALLBACK_URL}"
            prompt: auto
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
          development:
            metadataUrl: "${KEYCLOAK_METADATA_URL}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            callbackUrl: "${RHDH_CALLBACK_URL}"
            prompt: auto
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
      clientIdMetadataDocuments:
        enabled: true
    backend:
      actions:
        pluginSources:
          - 'software-catalog-mcp-extras'
          - 'techdocs-mcp-extras'
          - 'scaffolder-mcp-extras'
      auth:
        externalAccess:
          - type: static
            options:
              token: ${ADMIN_TOKEN}
              subject: admin-curl-access
          - type: static
            options:
              token: ${MCP_TOKEN}
              subject: mcp-clients
        keys:
          - secret: "${BACKEND_SECRET}"
      baseUrl: "${RHDH_BASE_URL}"
      database:
        connection:
          password: ${POSTGRES_PASSWORD}
          user: ${POSTGRES_USER}
      cors:
        origin: "${RHDH_BASE_URL}"
      csp:
        upgrade-insecure-requests: false
        img-src:
          - "'self'"
          - "data:"
          - https://img.freepik.com
          - https://cdn.dribbble.com
          - https://upload.wikimedia.org
          - https://podman-desktop.io
          - https://argo-cd.readthedocs.io
          - https://instructlab.ai
          - https://quay.io
          - https://news.mit.edu
        script-src:
          - "'self'"
          - "'unsafe-eval'"
          - https://cdn.jsdelivr.net
      reading:
        allow:
          - host: example.com
          - host: '*.mozilla.org'
          - host: '*.openshift.com'
          - host: '*.openshiftapps.com'
    techdocs:
      builder: local
      generator:
        runIn: local
    signInPage: oidc
    catalog:
      rules:
        - allow: [User, Group, System, Domain, Component, Resource, Location, Template, API, AiResource, AiModelServerAPI]
      locations:
        - target: https://github.com/benwilcock/rhdh-techdocs/blob/main/rhdh-catalog-info.yaml
          rules:
            - allow: [Component, System]
          type: url
        - target: https://github.com/redhat-developer/rhdh-ai-template/blob/ai-rolling-demo-1_10/all.yaml
          type: url
          rules:
            - allow: [Component, Location, Template]
        - target: https://github.com/redhat-developer/rhdh-llama-stack-agentic-sample/blob/ai-rolling-demo-1_10/all.yaml
          type: url
          rules:
            - allow: [Component, Location, Template]
        - target: https://github.com/redhat-ai-dev/ai-rolling-demo-gitops/blob/development/catalog-info.yaml
          type: url
          rules:
            - allow: [Component, System]
      providers:
        modelCatalog:
          kserve-kubeflow-connector:
            cluster-1:
              name: my-k8s-cluster
              kubeflow-model-catalog-url: '${KUBEFLOW_MODEL_CATALOG_URL:-}'
              default-owner: '${OWNER:-default-owner}'
              default-lifecycle: '${LIFECYCLE:-production}'
        github:
          providerId:
            organization: "${GITOPS_GIT_ORG}"
            schedule:
              frequency:
                minutes: 15
              initialDelay:
                seconds: 15
              timeout:
                minutes: 15
        githubOrg:
          githubUrl: https://github.com
          orgs: ["${GITOPS_GIT_ORG}"]
          schedule:
            frequency:
              minutes: 15
            initialDelay:
              seconds: 15
            timeout:
              minutes: 15
        keycloakOrg:
          default:
            baseUrl: "${KEYCLOAK_BASE_URL}"
            loginRealm: "${KEYCLOAK_REALM}"
            realm: "${KEYCLOAK_REALM}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            schedule:
              frequency: {minutes: 1}
              timeout: {minutes: 1}
              initialDelay: {seconds: 15}
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
    intelligent-assistant:
      screen-context:
        enabled: true
        screenshots:
          enabled: true
        dom-extraction:
          enabled: true
      notebooks:
        enabled: true
        queryDefaults:
          model: ${NOTEBOOKS_QUERY_MODEL}
          provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}
        chunkingStrategy:
          type: static
          maxChunkSizeTokens: 1200
          chunkOverlapTokens: 1 # min honored; 0 coerced to 50 by plugin bug
      mcpServers:
        - name: mcp-integration-tools
          auth: dcr
    mcpActions:
      namespacedToolNames: false
    permission:
      enabled: false
      rbac:
        policies-csv-file: /opt/app-root/src/rbac-policy.csv
        defaultPermissions:
          defaultRole: role:default/user
          basicPermissions:
            - permission: catalog.entity.read
              action: read
            - permission: intelligent-assistant.chat.read
              action: read
            - permission: intelligent-assistant.chat.create
              action: create
            - permission: intelligent-assistant.chat.update
              action: update
            - permission: intelligent-assistant.chat.delete
              action: delete
            - permission: intelligent-assistant.mcp.read
              action: read
        admin:
          users:
            - name: user:default/jcollier
            - name: user:default/mvaldron
            - name: user:default/lucasyoon
    integrations:
      github:
        - apps:
            - appId: ${GITHUB_APP_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              webhookUrl: ${GITHUB_APP_WEBHOOK_URL}
              webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
              privateKey: |
                ${GITHUB_APP_PRIVATE_KEY}
          host: github.com
    kubernetes:
      clusterLocatorMethods:
        - clusters:
            - authProvider: serviceAccount
              name: default
              serviceAccountToken: ${K8S_CLUSTER_TOKEN}
              skipTLSVerify: true
              url: https://kubernetes.default.svc
          type: config
      customResources:
        - apiVersion: v1beta1
          group: tekton.dev
          plural: pipelines
        - apiVersion: v1beta1
          group: tekton.dev
          plural: pipelineruns
        - apiVersion: v1beta1
          group: tekton.dev
          plural: taskruns
        - apiVersion: v1
          group: route.openshift.io
          plural: routes
      serviceLocatorMethod:
        type: multiTenant
    argocd:
      username: ${ARGOCD_USER}
      password: ${ARGOCD_PASSWORD}
      waitCycles: 25
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: default
              url: https://${ARGOCD_HOSTNAME}
              token: ${ARGOCD_API_TOKEN}
    i18n:
      locales:
        - en
        - it
        - ja
        - fr
    proxy:
      endpoints:
        "/developer-hub":
          target: https://raw.githubusercontent.com
          pathRewrite:
            "^/api/proxy/developer-hub$": "/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/homepage/plugins/homepage/dev/quickaccess-default.json"
            "^/api/proxy/developer-hub/learning-paths": "/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/ai-integrations/plugins/ai-experience/src/learning-paths/data.json"
          changeOrigin: true
          secure: false
        "/ai-rssfeed":
          target: "https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml"
          changeOrigin: true
          followRedirects: true
    boost:
      security:
        mode: 'development-only-no-auth'
        adminUsers:
          - 'user:default/admin'
          - 'user:default/guest'
      providers:
        ogx:
          baseUrl: ${BOOST_OGX_URL:-http://localhost:8321}
          defaultModel: ${BOOST_MODEL:-default}
    ai-catalog:
      entityProviders:
        ogx:
          baseUrl: ${BOOST_OGX_URL:-http://localhost:8321}
          # Fast enough for Kind CI agent ingest checks; models stay at plugin default (60s).
          agentRefreshIntervalSeconds: 30
          defaultAgent: router
          maxAgentTurns: 10
          agents:
            - id: router
              name: FantaCo Router
              description: Customer service router that classifies and transfers to specialists
              instructions: |
                You are a customer service router for FantaCo. Classify the user's
                question and transfer to the appropriate specialist agent.

                Transfer rules:
                - Legal questions (software licenses, embargoes, privacy/PII,
                  contracts, policies, compliance) -> transfer to Legal
                - Technical support (OpenShift/Kubernetes, deployment, permissions,
                  performance, FantaCo products like CloudSync or TechGear Pro,
                  troubleshooting) -> transfer to Software Support
                - HR questions (benefits, health care, vacation/PTO, retirement,
                  workspaces, office facilities, bonuses, compensation, perks,
                  participation requirements) -> transfer to Human Resources.
                  If the question mentions "workspaces at FantaCo", ALWAYS transfer
                  to Human Resources.
                - Sales questions (territories, leads, discounting, quotas, CRM,
                  brand guidelines, expenses, escalations, performance metrics)
                  -> transfer to Sales
                - Procurement questions (competitive bidding, vendor evaluation,
                  ethics, transparency, spending limits, approval processes)
                  -> transfer to Procurement

                Always transfer to the most appropriate specialist. Do not answer
                the question yourself.
              handoffs:
                - legal
                - support
                - hr
                - sales
                - procurement
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
            - id: legal
              name: Legal
              description: Handles questions about software licenses, embargoes, privacy/PII, contracts, policies, procedures, or compliance
              handoffDescription: Handles questions about software licenses, embargoes, privacy/PII, contracts, policies, procedures, or compliance
              instructions: |
                You are FantaCo's Legal department specialist. Based on the relevant
                documents in the knowledge base, help with the user's legal query.
                Provide a helpful response based on the documents found. If no
                relevant documents are found, provide general guidance.
              enableRAG: true
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
            - id: support
              name: Software Support
              description: Handles technical support questions about OpenShift/Kubernetes, deployment, permissions, performance, and FantaCo products
              handoffDescription: Handles technical support questions about OpenShift/Kubernetes, application deployment, permissions, resource utilization, performance, and FantaCo products (CloudSync, TechGear Pro)
              instructions: |
                You are FantaCo's Software Support specialist. Based on the relevant
                documents in the knowledge base, help with the user's technical
                support query. Provide a helpful response based on the documents
                found. If no relevant documents are found, provide general guidance.
              enableRAG: true
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
            - id: hr
              name: Human Resources
              description: Handles questions about employee benefits, health care, vacation/PTO, retirement, workspaces, and compensation
              handoffDescription: Handles questions about employee benefits, health care, vacation/PTO, retirement plans, workspaces, office facilities, work environment, bonuses, compensation, and perks
              instructions: |
                You are FantaCo's Human Resources specialist. Based on the relevant
                documents in the knowledge base, help with the user's HR query.

                FantaCo's benefits are organized into categories:
                - bare necessities: workspace, health care, vacation/PTO, retirement
                - beyond the basics: music, parties, activities, food services,
                  driving services, bonuses
                - caveats: participation requirements

                Try to narrow the response to details from the relevant sub-section
                of the benefits document when possible.

                Provide a helpful response based on the documents found. If no
                relevant documents are found, provide general guidance.
              enableRAG: true
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
            - id: sales
              name: Sales
              description: Handles questions about sales territories, leads, discounting, quotas, CRM, and performance metrics
              handoffDescription: Handles questions about sales territories, lead assignments, discounting, deal approval, quotas, sales compensation, CRM systems, brand guidelines, expenses, escalations, and performance metrics
              instructions: |
                You are FantaCo's Sales specialist. Based on the relevant documents
                in the knowledge base, help with the user's sales query.

                FantaCo's sales operation manual covers:
                - geographic territories
                - lead assignments
                - discounting and deal approval
                - quotas and compensation
                - CRM systems
                - brands and communications
                - expenses and escalations
                - performance and compliance

                Try to narrow the response to details from the relevant sub-section
                of the sales document when possible.

                Provide a helpful response based on the documents found. If no
                relevant documents are found, provide general guidance.
              enableRAG: true
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
            - id: procurement
              name: Procurement
              description: Handles questions about competitive bidding, vendor evaluation, procurement ethics, and approval processes
              handoffDescription: Handles questions about competitive bidding, vendor evaluation, procurement ethics, transparency, spending limits, and approval processes
              instructions: |
                You are FantaCo's Procurement specialist. Based on the relevant
                documents in the knowledge base, help with the user's procurement
                query.

                FantaCo's procurement policies cover:
                - competitive bidding
                - vendor evaluation and categorization
                - ethics and transparency
                - review processes
                - spending limits

                Try to narrow the response to details from the relevant sub-section
                of the procurement document when possible.

                Provide a helpful response based on the documents found. If no
                relevant documents are found, provide general guidance.
              enableRAG: true
              model: ${BOOST_MODEL:-}
              lifecycleStage: published
  extraAppConfig:
    - filename: kserve-connector-app-config.yaml
      configMapRef: kserve-connector-app-config
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /healthcheck
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 2
    timeoutSeconds: 2
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /healthcheck
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 2
  dynamicPlugins:
    includes:
      - "dynamic-plugins.default.yaml"
    plugins:
      ##### Custom sign in page plugin (now NFS compatible) #####
      - package: oci://quay.io/redhat-ai-dev/rolling-demo-customized-sign-in-page:0.2.0!red-hat-developer-hub-backstage-plugin-rolling-demo-customized-sign-in-page
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              red-hat-developer-hub.backstage-plugin-rolling-demo-customized-sign-in-page:
                signInPage:
                  importName: RollingDemoCustomizedSignInPage
      ##### NFS Frontend Plugins #####
      # App Auth (NFS sign-in page, replaces custom sign-in page)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-auth:bs_1.54.9__1.2.0
        disabled: false
      # App Integrations (NFS provider integrations)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-integrations:bs_1.54.9__1.1.1
        disabled: false
      # App Defaults (NFS default extensions)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.54.9__1.11.0
        disabled: false
      # Theme
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-theme:bs_1.54.9__1.4.0
        disabled: false
      # OAuth2 callback handler (may provide /oauth2/* route for OIDC flow)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth:bs_1.54.9__0.1.11
        disabled: false
      ##### Red Hat Plugins #####
      # ArgoCD (frontend disabled — no NFS version yet; backends kept)
      # TODO: re-enable when https://github.com/backstage/community-plugins/pull/10112 merges
      # and updated dynamic plugin images are available for argocd and argocd-backend
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.0
        disabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:bs_1.54.9__4.9.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.54.9__1.9.0
        disabled: false

      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-search-backend-module-techdocs:bs_1.54.9__0.4.17
        disabled: false
      # MCP Actions plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.9__0.2.1
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.9__0.2.5
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.9__0.2.6
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.54.9__0.4.4
        disabled: false
      # Model Catalog Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog:bs_1.54.9__1.1.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend:bs_1.54.9__0.6.3
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-kserve-kubeflow-connector-backend:bs_1.54.9__0.3.0
        disabled: false
      # AI Resource Kind Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.54.9__0.3.1
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-agent:bs_1.54.9__0.4.1
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-extensions:bs_1.54.9__0.5.2
        disabled: false
      # AI Catalog Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-ai-catalog:bs_1.54.9__1.0.1
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-ogx-entity-provider:bs_1.54.9__1.0.1
        disabled: false
      # Tekton CI (NFS — no pluginConfig needed)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5
        disabled: false
      ##### Default Backstage Dynamic Plugins (OCI images for NFS) #####
      # Catalog frontend (NFS page + sidebar nav — PR build, no released version yet)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog:pr_2563__2.0.1
        disabled: false
      # Catalog Import
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog-import:bs_1.54.9__0.13.17
        disabled: false
      # Scaffolder frontend (NFS /create page — PR build)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-scaffolder:pr_2563__1.36.1
        disabled: false
      # Search frontend (NFS /search page — PR build)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-search:pr_2563__1.7.0
        disabled: false
      # Home page (NFS / route)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-home:bs_1.54.9__0.9.9
        disabled: false
      # RHDH Homepage (customized home page with widgets + root redirect)
      # The "recently-visited" and "top-visited" widgets are disabled via app.extensions
      # because they require a visits API that the homepage-backend doesn't fully implement.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage:bs_1.54.9__3.0.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage-backend:bs_1.54.9__0.6.0
        disabled: false
      # Global Header
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-global-header:bs_1.54.9__3.1.0
        disabled: false
      # Kubernetes
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-kubernetes-backend:bs_1.54.9__0.21.10
        disabled: false
