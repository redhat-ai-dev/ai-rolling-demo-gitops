global:
  ci: false
  dynamic:
    includes:
      - "dynamic-plugins.default.yaml"
    plugins:
      ##### NFS Frontend Plugins #####
      # App Auth (NFS sign-in page, replaces custom sign-in page)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-auth:bs_1.52.0__0.1.0
        disabled: false
      # App Integrations (NFS provider integrations)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-integrations:bs_1.52.0__0.1.0
        disabled: false
      # App Defaults (NFS default extensions)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.2
        disabled: false
      # Theme
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-theme:bs_1.52.0__1.0.2
        disabled: false

      # OAuth2 callback handler (may provide /oauth2/* route for OIDC flow)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth:bs_1.52.0__0.1.9
        disabled: false

      ##### Red Hat Plugins #####
      # ArgoCD (frontend disabled — no NFS version yet; backends kept)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.0
        disabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:bs_1.49.4__4.8.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.49.4__1.8.1
        disabled: false

      # MCP Actions plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.49.4__0.1.11
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.49.4__0.2.2
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.49.4__0.2.3
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.49.4__0.4.1
        disabled: false

      # Model Catalog Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog:bs_1.52.0__1.0.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend:bs_1.52.0__0.6.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-kserve-kubeflow-connector-backend:bs_1.52.0__0.1.1
        disabled: false

      # AI Resource Kind Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.52.0__0.2.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-agent:bs_1.52.0__0.2.1
        disabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-extensions:pr_3227__0.4.0
        disabled: false

      # Boost Plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-boost:bs_1.52.0__0.4.0
        disabled: false

      # Tekton CI (NFS — no pluginConfig needed)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.52.0__3.41.0
        disabled: false

      ##### Default Backstage Dynamic Plugins (OCI images for NFS) #####
      # Global Header
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-global-header:bs_1.52.0__2.0.0
        disabled: false

      # Kubernetes
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-kubernetes-backend:bs_1.52.0__0.21.5
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-kubernetes:bs_1.52.0__0.12.20
        disabled: false
      # Topology
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-topology:bs_1.52.0__2.16.0
        disabled: false

      # Catalog plugins
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-catalog-backend-module-keycloak:pr_2510__3.21.0
        disabled: false

      # TechDocs
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-techdocs-backend:bs_1.52.0__2.2.1
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-techdocs:bs_1.52.0__1.17.7
        disabled: false

      # Gitlab Plugins
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-gitlab-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-dynamic
        disabled: true
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-org-dynamic
        disabled: true
        
      # Github Plugins
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-org-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: false

  clusterRouterBase: apps.rosa.redhat-ai-dev.m6no.p3.openshiftapps.com
  host: ""
  auth:
    backend:
      enabled: true
      existingSecret: ""
      value: ""

  # Configure lightspeed post GA
  lightspeed:
    enabled: true
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant:bs_1.52.0__3.2.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:bs_1.52.0__3.2.0
        disabled: false
    secret:
      create: false
      name: "llama-stack-secrets"
    sidecar:
      image: quay.io/lightspeed-core/lightspeed-stack:dev-20260729-2a9c8a7
      args:
        - --synthesized-config-output
        - /tmp/.generated/run.yaml
      # Path to the VERTEX_AI_CREDENTIALS key mounted from llama-stack-secrets.
      # volumeMount is applied by rolling-demo-sidecars-job (chart 6.1.1 has no sidecar.extraVolumeMounts).
      # TODO: after upgrading to an rhdh-chart with lightspeed.core.extraVolumeMounts
      # (https://github.com/redhat-developer/rhdh-chart/pull/438), mount via values and drop the
      # PostSync patch — that workaround will be redundant.
      env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app-root/gcp-creds.json
    configMaps:
      - name: stack
        create: false
        nameOverride: "lightspeed-stack-config"
        mountPath: /app-root/lightspeed-stack.yaml
        subPath: lightspeed-stack.yaml
        sourceFile: lightspeed-stack.yaml
        optional: false
      # override llama-stack-config to keep the gpt allowed models customization
      - name: config
        create: false
        nameOverride: "llama-stack-config"
        mountPath: /app-root/config.yaml
        subPath: config.yaml
        sourceFile: config.yaml
        optional: false
      - name: rhdh-profile
        create: false
        nameOverride: "rhdh-profile"
        mountPath: /app-root/rhdh-profile.py
        subPath: rhdh-profile.py
        sourceFile: rhdh-profile.py
        optional: false
    initContainer:
      name: lightspeed-rag-init
      args:
        - >-
          mkdir -p /tmp/data &&
          echo 'Copying Lightspeed RAG data...' &&
          cp -r /rag/vector_db /rag-content/ &&
          cp -r /rag/embeddings_model /rag-content/ &&
          echo 'Standard RAG copy complete.' &&
          if [ -d /rag-content/byok-staging/vector_db ]; then
            echo 'Merging BYOK data...' &&
            if cp -r /rag-content/byok-staging/vector_db/* /rag-content/vector_db/ 2>&1; then
              echo 'BYOK merge complete.';
            else
              echo 'WARNING: BYOK merge failed. LCS will start without BYOK sources.' >&2;
            fi;
          else
            echo 'No BYOK staging data, skipping.';
          fi

backstage:
  # override the default name to stay in the context
  # of the same deployment resource (e.g. rolling-demo-backstage)
  # where the latest rhdh-chart introduces rolling-demo-developer-hub
  nameOverride: backstage
  upstream:
    nameOverride: backstage
    backstage:
      image:
        registry: quay.io
        repository: rhdh/rhdh-hub-rhel9
        tag: "2.0-61"
        pullSecrets:
          - quay-pull-secret
      command: []
      extraAppConfig:
        - filename: kserve-connector-app-config.yaml
          configMapRef: kserve-connector-app-config
      appConfig:
        app:
          title: AI Rolling Demo Developer Hub
          baseUrl: "${RHDH_BASE_URL}"
          analytics:
            adoptionInsights:
              maxBufferSize: 20
              flushInterval: 5000
              debug: false
              licensedUsers: 50
        auth:
          environment: production
          # Enable experimental features for OIDC auth
          experimentalClientIdMetadataDocuments:
            enabled: true
          experimentalRefreshToken:
            enabled: true
          session:
            secret: "${BACKEND_SECRET}"
          providers:
            oidc:
              production:
                metadataUrl: "${KEYCLOAK_METADATA_URL}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                callbackUrl: "${RHDH_CALLBACK_URL}"
                prompt: auto
                signIn:
                  resolvers:
                    - resolver: preferredUsernameMatchingUserEntityName
              development:
                metadataUrl: "${KEYCLOAK_METADATA_URL}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                callbackUrl: "${RHDH_CALLBACK_URL}"
                prompt: auto
                signIn:
                  resolvers:
                    - resolver: preferredUsernameMatchingUserEntityName
        backend:
          actions:
            pluginSources:
              - 'software-catalog-mcp-extras'
              - 'techdocs-mcp-extras'
              - 'scaffolder-mcp-extras'
          auth:
            externalAccess:
              - type: static
                options:
                  token: ${ADMIN_TOKEN}
                  subject: admin-curl-access
              - type: static
                options:
                  token: ${MCP_TOKEN}
                  subject: mcp-clients
            keys:
              - secret: "${BACKEND_SECRET}"
          baseUrl: "${RHDH_BASE_URL}"
          database:
            connection:
              password: ${POSTGRESQL_ADMIN_PASSWORD}
              user: postgres
          cors:
            origin: "${RHDH_BASE_URL}"
          csp:
            upgrade-insecure-requests: false
            img-src:
              - "'self'"
              - "data:"
              - https://img.freepik.com
              - https://cdn.dribbble.com
              - https://upload.wikimedia.org
              - https://podman-desktop.io
              - https://argo-cd.readthedocs.io
              - https://instructlab.ai
              - https://quay.io
              - https://news.mit.edu
            script-src:
              - "'self'"
              - "'unsafe-eval'"
              - https://cdn.jsdelivr.net
          reading:
            allow:
              - host: example.com
              - host: '*.mozilla.org'
              - host: '*.openshift.com'
              - host: '*.openshiftapps.com'
        signInPage: oidc
        catalog:
          rules:
            - allow: [User, Group, System, Domain, Component, Resource, Location, Template, API, AiResource, AiModelServerAPI]
          locations:
            - target: https://github.com/benwilcock/rhdh-techdocs/blob/main/rhdh-catalog-info.yaml
              rules:
                - allow: [Component, System]
              type: url
            - target: https://github.com/redhat-ai-dev/ai-lab-template/blob/ai-rolling-demo-1_10/all.yaml
              type: url
              rules:
                - allow: [Component, Location, Template]
            - target: https://github.com/redhat-ai-dev/llama-stack-agentic-sample/blob/ai-rolling-demo-1_10/all.yaml
              type: url
              rules:
                - allow: [Component, Location, Template]
            - target: https://github.com/redhat-ai-dev/ai-rolling-demo-gitops/blob/development/catalog-info.yaml
              type: url
              rules:
                - allow: [Component, System]
          providers:
            modelCatalog: {}
            github:
              providerId:
                organization: "${GITOPS_GIT_ORG}"
                schedule:
                  frequency:
                    minutes: 15
                  initialDelay:
                    seconds: 15
                  timeout:
                    minutes: 15
            githubOrg:
              githubUrl: https://github.com
              orgs: ["${GITOPS_GIT_ORG}"]
              schedule:
                frequency:
                  minutes: 15
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 15
            keycloakOrg:
              default:
                baseUrl: "${KEYCLOAK_BASE_URL}"
                loginRealm: "${KEYCLOAK_REALM}"
                realm: "${KEYCLOAK_REALM}"
                clientId: "${KEYCLOAK_CLIENT_ID}"
                clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
                schedule:
                  frequency: { minutes: 1 }
                  timeout: { minutes: 1 }
                  initialDelay: { seconds: 15 }
                signIn:
                  resolvers:
                    - resolver: emailMatchingUserEntityProfileEmail
        intelligent-assistant:
          notebooks:
            enabled: true
            queryDefaults:
              model: ${NOTEBOOKS_QUERY_MODEL}
              provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}
          mcpServers:
            - name: mcp-integration-tools
              token: ${MCP_TOKEN}
        mcpActions:
          namespacedToolNames: false
        integrations:
          github:
            - apps:
                - appId: ${GITHUB_APP_APP_ID}
                  clientId: ${GITHUB_APP_CLIENT_ID}
                  clientSecret: ${GITHUB_APP_CLIENT_SECRET}
                  webhookUrl: ${GITHUB_APP_WEBHOOK_URL}
                  webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
                  privateKey: |
                    ${GITHUB_APP_PRIVATE_KEY}
              host: github.com
        kubernetes:
          clusterLocatorMethods:
            - clusters:
                - authProvider: serviceAccount
                  name: default
                  serviceAccountToken: ${K8S_CLUSTER_TOKEN}
                  skipTLSVerify: true
                  url: https://kubernetes.default.svc
              type: config
          customResources:
            - apiVersion: v1beta1
              group: tekton.dev
              plural: pipelines
            - apiVersion: v1beta1
              group: tekton.dev
              plural: pipelineruns
            - apiVersion: v1beta1
              group: tekton.dev
              plural: taskruns
            - apiVersion: v1
              group: route.openshift.io
              plural: routes
          serviceLocatorMethod:
            type: multiTenant
        argocd:
          username: ${ARGOCD_USER}
          password: ${ARGOCD_PASSWORD}
          waitCycles: 25
          appLocatorMethods:
          - type: 'config'
            instances:
              - name: default
                url: https://${ARGOCD_HOSTNAME}
                token: ${ARGOCD_API_TOKEN}
        i18n:
          locales:
            - en
            - it
            - ja
            - fr
        proxy:
          endpoints:
            "/developer-hub":
              target: https://raw.githubusercontent.com
              pathRewrite:
                "^/api/proxy/developer-hub/learning-paths": "/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/ai-integrations/plugins/ai-experience/src/learning-paths/data.json"
              changeOrigin: true
              secure: false
            "/ai-rssfeed":
              target: "https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml"
              changeOrigin: true
              followRedirects: true
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /healthcheck
          port: 7007
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 2
        timeoutSeconds: 2
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /healthcheck
          port: 7007
          scheme: HTTP
        initialDelaySeconds: 60
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 2
      extraEnvVars:
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: "{{ .Release.Name }}-postgresql"
        # Only for demo purposes: Remove in production
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        # Enable NFS app-next frontend shell (required for pure-NFS plugins like boost)
        - name: APP_CONFIG_app_packageName
          value: "app-next"
        - name: ENABLE_STANDARD_MODULE_FEDERATION
          value: "true"
      extraEnvVarsSecrets:
        - github-secrets
        - kubernetes-secrets
        - rhdh-secrets
        - keycloak-secrets
        - argocd-secrets
        - lightspeed-secrets
        - llama-stack-secrets
        - kserve-connector-secrets
      args:
        - "--config"
        - dynamic-plugins-root/app-config.dynamic-plugins.yaml
      extraVolumeMounts:
        - name: dynamic-plugins-root
          mountPath: /opt/app-root/src/dynamic-plugins-root
        # tmp backstage volume for scaffolder tasks
        - name: backstage-tmp
          mountPath: /tmp
        - name: extensions-catalog
          mountPath: /extensions
      extraVolumes:
        - name: dynamic-plugins-root
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
        - name: dynamic-plugins
          configMap:
            defaultMode: 420
            name: "{{ .Release.Name }}-dynamic-plugins"
            optional: true
        - name: dynamic-plugins-npmrc
          secret:
            defaultMode: 420
            optional: true
            secretName: dynamic-plugins-npmrc
        # tmp backstage volume for scaffolder tasks
        - name: backstage-tmp
          emptyDir: {}
        - name: extensions-catalog
          emptyDir: {}
        # GCP SA JSON for Vertex AI. Pod volume is Helm-managed; lightspeed-core volumeMount is
        # applied by rolling-demo-sidecars-job until rhdh-chart gains lightspeed.core.extraVolumeMounts
        # (https://github.com/redhat-developer/rhdh-chart/pull/438) — that PostSync patch becomes redundant.
        - name: gcp-creds
          secret:
            secretName: llama-stack-secrets
            items:
              - key: VERTEX_AI_CREDENTIALS
                path: gcp-creds.json
      initContainers:
        - name: install-dynamic-plugins
          image: '{{ include "backstage.image" . }}'
          command:
            - ./install-dynamic-plugins.sh
            - /dynamic-plugins-root
          env:
            - name: NPM_CONFIG_USERCONFIG
              value: /opt/app-root/src/.npmrc.dynamic-plugins
            - name: CATALOG_INDEX_IMAGE
              value: '{{ .Values.global.catalogIndex.image.registry }}/{{ .Values.global.catalogIndex.image.repository }}:{{ .Values.global.catalogIndex.image.tag }}'
            - name: CATALOG_ENTITIES_EXTRACT_DIR
              value: '/extensions'
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /dynamic-plugins-root
              name: dynamic-plugins-root
            - mountPath: /opt/app-root/src/dynamic-plugins.yaml
              name: dynamic-plugins
              readOnly: true
              subPath: dynamic-plugins.yaml
            - mountPath: /opt/app-root/src/.npmrc.dynamic-plugins
              name: dynamic-plugins-npmrc
              readOnly: true
              subPath: .npmrc
            - mountPath: /extensions
              name: extensions-catalog
        - name: byok-rag-init
          image: quay.io/redhat-ai-dev/byok-sample:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
          args:
            - >-
              echo 'Staging BYOK RAG data...' &&
              mkdir -p /rag-content/byok-staging &&
              if cp -r /byok/vector_db /rag-content/byok-staging/ 2>&1; then
                echo 'BYOK staging complete.';
              else
                echo 'WARNING: BYOK staging failed. LCS will start without BYOK sources.' >&2;
              fi
          volumeMounts:
            - name: lightspeed-rag
              mountPath: /rag-content
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 150Mi
      installDir: /opt/app-root/src
      podAnnotations:
        checksum/dynamic-plugins: >-
          {{- include "common.tplvalues.render" ( dict "value"
          .Values.global.dynamic "context" $) | sha256sum }}
    ingress:
      host: "{{ .Values.global.host }}"
    postgresql:
      enabled: true
      postgresqlDataDir: /var/lib/pgsql/data/userdata
      image:
        registry: registry.redhat.io
        repository: rhel9/postgresql-15
        tag: latest
      auth:
        username: postgres
        existingSecret: "{{ .Release.Name }}-postgresql"
        secretKeys:
          adminPasswordKey: postgres-password
      primary:
        podSecurityContext:
          enabled: false
        containerSecurityContext:
          enabled: false
        persistence:
          enabled: true
          size: 1Gi
          mountPath: /var/lib/pgsql/data
        extraEnvVars:
          - name: POSTGRESQL_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: "{{ .Release.Name }}-postgresql"
  route:
    annotations: {}
    enabled: true
    host: "{{ .Values.global.host }}"
    path: "/"
    wildcardPolicy: None
    tls:
      enabled: true
      termination: "edge"
      certificate: ""
      key: ""
      caCertificate: ""
      destinationCACertificate: ""
      insecureEdgeTerminationPolicy: "Redirect"
rhoai:
  enabled: true
