  host: ""
  openshift:
    clusterRouterBase: apps.rosa.redhat-ai-dev.m6no.p3.openshiftapps.com
    route:
      annotations: {}
      enabled: true
      host: "{{ .Values.host }}"
      path: "/"
      wildcardPolicy: None
      tls:
        enabled: true
        termination: "edge"
        certificate: ""
        key: ""
        caCertificate: ""
        destinationCACertificate: ""
        insecureEdgeTerminationPolicy: "Redirect"
  auth:
    backend:
      enabled: true
      existingSecretRef:
        name: rhdh-secrets
        key: BACKEND_SECRET
  extraEnv:
    # Only for demo purposes: Remove in production
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
  extraEnvFrom:
    - secretRef:
        name: github-secrets
    - secretRef:
        name: kubernetes-secrets
    - secretRef:
        name: rhdh-secrets
    - secretRef:
        name: keycloak-secrets
    - secretRef:
        name: argocd-secrets
    - secretRef:
        name: lightspeed-secrets
    - secretRef:
        name: llama-stack-secrets
    - secretRef:
        name: kserve-connector-secrets
  extraVolumeMounts:
    - name: rbac-policy
      mountPath: /opt/app-root/src/rbac-policy.csv
      subPath: rbac-policy.csv
  extraVolumes:
    - name: rbac-policy
      configMap:
        name: "{{ .Release.Name }}-rbac-policy"
    - name: gcp-creds
      secret:
        secretName: llama-stack-secrets
        items:
          - key: VERTEX_AI_CREDENTIALS
            path: gcp-creds.json
    - name: lightspeed-skills
      emptyDir: {}
  extraInitContainers:
    - name: byok-rag-init
      image: quay.io/redhat-ai-dev/byok-sample:latest
      imagePullPolicy: Always
      command:
        - sh
        - -c
      args:
        - >-
          echo 'Staging BYOK RAG data...' &&
          mkdir -p /tmp/byok-staging /tmp/vector_db &&
          if cp -r /byok/vector_db /tmp/byok-staging/ 2>&1 &&
             cp -r /tmp/byok-staging/vector_db/. /tmp/vector_db/ 2>&1 &&
             chmod -R a+rwX /tmp/vector_db; then
            echo 'BYOK merge complete.';
          else
            echo 'WARNING: BYOK merge failed. LCS will start without BYOK sources.' >&2;
          fi
      volumeMounts:
        - name: lightspeed-data
          mountPath: /tmp
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 150Mi
    - name: fetch-lightspeed-skills
      image: quay.io/redhat-ai-dev/utils:latest
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
      args:
        - >-
          set -euo pipefail;
          rm -rf /skills/.source;
          git clone --depth 1 --branch main https://github.com/redhat-developer/rhdh-skills.git /skills/.source;
          test -d /skills/.source/skills;
          find /skills -mindepth 1 -maxdepth 1 ! -name .source -exec rm -rf {} +;
          cp -R /skills/.source/skills/. /skills/;
          rm -rf /skills/.source
      volumeMounts:
        - name: lightspeed-skills
          mountPath: /skills
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  extraContainers:
    - name: feedback-harvester
      image: quay.io/redhat-ai-dev/feedback-harvester:v0.1.0
      env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: user
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: password
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: lightspeed-postgres-info
              key: db-name
        - name: PGHOST
          value: lightspeed-postgres-svc.lightspeed-postgres.svc.cluster.local
        - name: PGPORT
          value: "5432"
        - name: FEEDBACK_DIRECTORY
          value: /tmp/data/feedback
        - name: FETCH_FREQUENCY
          value: "60"
      volumeMounts:
        - name: lightspeed-data
          mountPath: /tmp/data/feedback
          subPath: data/feedback
  postgresql:
    enabled: true
    postgresqlDataDir: /var/lib/pgsql/data/userdata
    image:
      registry: registry.redhat.io
      repository: rhel9/postgresql-15
      tag: latest
    auth:
      username: postgres
      existingSecret: "rhdhai-rhdh-dev-postgresql"
      secretKeys:
        adminPasswordKey: postgres-password
    primary:
      podSecurityContext:
        enabled: false
      containerSecurityContext:
        enabled: false
      persistence:
        enabled: true
        size: 1Gi
        mountPath: /var/lib/pgsql/data
rhoai:
  enabled: true
  # RoleBindings into rhoai-model-registries. Set false on Kind (no RHOAI).
  modelRegistry:
    enabled: true
