name: Update RHDH Plugins

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:

jobs:
    update-plugins:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            packages: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: development

            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Update plugins for next__ and bs_ tags
              uses: redhat-ai-dev/rhdh-plugin-gitops-updater@573eea06affab90efaef8baa8596e6f7e0a67ca2 # v1.0.11
              with:
                  config-path: "charts/rhdh/values.yaml"
                  github-token: ${{ steps.app-token.outputs.token }}
                  base-branch: development
                  tag-prefixes: |
                      next__
                      bs_
                  update-pr-strategy: "separate"
                  verbose: "1"
