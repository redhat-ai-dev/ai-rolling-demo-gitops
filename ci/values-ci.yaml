global:
  # Kind does not deploy the separate Lightspeed PostgreSQL resources.
  ci: true

redhat-developer-hub:
  openshift:
    route:
      enabled: false
  intelligentAssistant:
    okp:
      enabled: false
  appConfig:
    permission:
      enabled: false
    intelligent-assistant:
      mcpServers:
        - name: mcp-integration-tools
          token: ${MCP_TOKEN}
  # Helm replaces lists, so retain the skills init alongside the Kind BYOK init.
  extraInitContainers:
    - name: byok-rag-init
      image: busybox:1.38.0
      command:
        - sh
        - -c
      args:
        - >-
          mkdir -m 777 -p /tmp/vector_db/notebooks /tmp/vector_db/custom_docs &&
          echo 'CI: vector store directories initialized.'
      volumeMounts:
        - name: lightspeed-data
          mountPath: /tmp
    - name: fetch-lightspeed-skills
      image: quay.io/redhat-ai-dev/utils:latest
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
      args:
        - >-
          set -euo pipefail;
          rm -rf /skills/.source;
          git clone --depth 1 --branch main https://github.com/redhat-developer/rhdh-skills.git /skills/.source;
          test -d /skills/.source/skills;
          find /skills -mindepth 1 -maxdepth 1 ! -name .source -exec rm -rf {} +;
          cp -R /skills/.source/skills/. /skills/;
          rm -rf /skills/.source
      volumeMounts:
        - name: lightspeed-skills
          mountPath: /skills
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  postgresql:
    image:
      registry: quay.io
      repository: fedora/postgresql-15
      tag: latest
    postgresqlDataDir: /fedora/postgresql/data
    auth:
      existingSecret: rolling-demo-postgresql
    primary:
      podSecurityContext:
        enabled: true
      containerSecurityContext:
        enabled: true
      persistence:
        mountPath: /fedora/postgresql

# The vendored OKP chart uses OpenShift Routes and is not installed on Kind.
okp:
  enabled: false

rhoai:
  enabled: false
