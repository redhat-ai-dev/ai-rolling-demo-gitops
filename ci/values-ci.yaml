global:
  # Disables OpenShift-specific resources (sidecars job, chart lightspeed-postgres).
  # Kind still gets a slim pgvector Postgres via ci/lightspeed-postgres.yaml (ci-setup.sh)
  # so LCORE remote::pgvector can start.
  ci: true
  clusterRouterBase: apps.testing
  lightspeed:
    initContainer:
      name: lightspeed-rag-init
      # Same dir ownership flow as prod: create vector_db first, then merge from
      # byok-staging. CI skips the rag-content image data copy and only mkdirs.
      args:
        - >-
          mkdir -m 777 -p /rag-content/vector_db/notebooks &&
          mkdir -m 777 -p /rag-content/vector_db/rhdh_product_docs/1.10 &&
          mkdir -m 777 -p /rag-content/vector_db/custom_docs &&
          mkdir -m 777 -p /rag-content/embeddings_model &&
          echo 'CI: RAG directories initialized.' &&
          if [ -d /rag-content/byok-staging/vector_db ]; then
            echo 'Merging BYOK data...' &&
            if cp -r /rag-content/byok-staging/vector_db/* /rag-content/vector_db/ 2>&1; then
              echo 'BYOK merge complete.';
            else
              echo 'WARNING: BYOK merge failed. LCS will start without BYOK sources.' >&2;
            fi;
          else
            echo 'No BYOK staging data, skipping.';
          fi

backstage:
  # Routes are an OpenShift CRD — disable in favour of nginx Ingress.
  route:
    enabled: false
  upstream:
    backstage:
      # Helm replaces initContainers lists, so install-dynamic-plugins must be
      # restated when adding CI's byok-rag-init override.
      initContainers:
        - name: install-dynamic-plugins
          image: '{{ include "backstage.image" . }}'
          command:
            - ./install-dynamic-plugins.sh
            - /dynamic-plugins-root
          env:
            - name: NPM_CONFIG_USERCONFIG
              value: /opt/app-root/src/.npmrc.dynamic-plugins
            - name: CATALOG_INDEX_IMAGE
              value: '{{ .Values.global.catalogIndex.image.registry }}/{{ .Values.global.catalogIndex.image.repository }}:{{ .Values.global.catalogIndex.image.tag }}'
            - name: CATALOG_ENTITIES_EXTRACT_DIR
              value: '/extensions'
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /dynamic-plugins-root
              name: dynamic-plugins-root
            - mountPath: /opt/app-root/src/dynamic-plugins.yaml
              name: dynamic-plugins
              readOnly: true
              subPath: dynamic-plugins.yaml
            - mountPath: /opt/app-root/src/.npmrc.dynamic-plugins
              name: dynamic-plugins-npmrc
              readOnly: true
              subPath: .npmrc
            - mountPath: /extensions
              name: extensions-catalog
        # Mirror prod staging path; busybox only creates dirs (no byok-sample copy).
        - name: byok-rag-init
          image: busybox:1.38.0
          command:
            - sh
            - -c
          args:
            - >-
              echo 'Staging BYOK RAG directories...' &&
              mkdir -p /rag-content/byok-staging/vector_db/custom_docs &&
              echo 'CI: BYOK staging complete.'
          volumeMounts:
            - name: lightspeed-rag
              mountPath: /rag-content
    postgresql:
      # Use the bundled bitnami image (default for this chart) instead of
      # registry.redhat.io/rhel9/postgresql-15 which requires Red Hat registry auth.
      image:
        registry: quay.io
        repository: fedora/postgresql-15
        tag: "latest"
      # Reset paths from Red Hat-specific values back to bitnami defaults.
      postgresqlDataDir: /fedora/postgresql/data
      primary:
        podSecurityContext:
          enabled: true
        containerSecurityContext:
          enabled: true
        persistence:
          mountPath: /fedora/postgresql

# OKP Route is an OpenShift CRD — disable on Kind.
okp:
  route:
    enabled: false

rhoai:
  enabled: false
